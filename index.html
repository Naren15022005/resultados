<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICFES 2026 - Estimado vs Resultado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i data-lucide="book-open" width="48" height="48"></i>
                ICFES 2026
                <span id="connectionDot" title="Conectando..." style="width:11px;height:11px;border-radius:50%;background:var(--text-dim);display:inline-block;flex-shrink:0;transition:all 0.4s;"></span>
            </h1>
            <p>Estimado vs Resultado</p>
            <a href="participantes.html" class="header-nav-btn">
                <i data-lucide="users" width="16" height="16"></i>
                Ver todos los participantes
            </a>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" data-tab="hoy">
                    <i data-lucide="calendar" width="15" height="15"></i> Hoy — Estimado
                </button>
                <button class="tab-btn" data-tab="resultados">
                    <i data-lucide="clipboard-check" width="15" height="15"></i> Resultado
                </button>
                <button class="tab-btn" data-tab="ranking">
                    <i data-lucide="trophy" width="15" height="15"></i> Ranking
                </button>
            </div>

            <!-- TAB: HOY -->
            <div id="hoy" class="tab-content active">
                <h2>¿Qué puntuación crees que vas a sacar?</h2>

                <div id="hoyMessage"></div>

                <form id="formHoy">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" placeholder="Juan Pérez" required>
                    </div>

                    <div class="form-group">
                        <label for="estimado">Tu estimación (0–500)</label>
                        <input type="number" id="estimado" min="0" max="500" placeholder="380" required>
                    </div>

                    <div class="form-group">
                        <label>Foto (opcional)</label>
                        <div class="image-upload-area" id="uploadArea">
                            <input type="file" id="fotoInput" accept="image/*">
                            <div id="uploadText">
                                <div class="upload-icon">
                                    <i data-lucide="camera" width="32" height="32"></i>
                                </div>
                                <div>Haz clic o arrastra una foto</div>
                                <div class="upload-hint">JPG, PNG, WebP — se comprime automáticamente</div>
                            </div>
                        </div>
                        <div class="image-preview-wrap" id="imagePreviewWrap">
                            <img id="imagePreview" src="" alt="Preview">
                            <div>
                                <div class="upload-ready-label">Foto lista</div>
                                <button type="button" class="remove-image-btn" id="removeImageBtn">
                                    <i data-lucide="x" width="13" height="13"></i> Quitar
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i data-lucide="save" width="17" height="17"></i>
                        Guardar mi Estimado
                    </button>
                </form>

                <div style="margin-top:36px;border-top:1px solid var(--border);padding-top:28px;">
                    <h3 style="margin-bottom:18px;">Participantes registrados</h3>
                    <div id="participantesHoy" class="participant-list"></div>
                </div>
            </div>

            <!-- TAB: RESULTADOS -->
            <div id="resultados" class="tab-content">
                <h2>Ingresa tu resultado</h2>

                <div id="resultadosMessage"></div>

                <div class="form-group">
                    <label for="buscarNombre">Tu nombre</label>
                    <input type="text" id="buscarNombre" placeholder="Juan Pérez">
                </div>

                <div id="resultadosContainer"></div>
                <div id="comparacionContainer"></div>
            </div>

            <!-- TAB: RANKING -->
            <div id="ranking" class="tab-content">
                <h2>Ranking General</h2>
                <div class="stats-grid" id="statsGrid"></div>
                <div id="rankingContainer"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>

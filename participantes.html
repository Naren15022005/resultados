<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICFES 2026 - Participantes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <a href="index.html" class="back-btn">
                <i data-lucide="arrow-left" width="15" height="15"></i>
                Volver
            </a>
            <span class="page-title">
                Participantes
                <span id="connectionDot" title="Conectando..." style="width:10px;height:10px;border-radius:50%;background:var(--text-dim);display:inline-block;margin-left:6px;vertical-align:middle;transition:all 0.4s;"></span>
            </span>
            <a href="index.html" class="btn btn-primary btn-small" style="text-decoration:none;">
                <i data-lucide="plus" width="15" height="15"></i>
                Agregar
            </a>
        </div>

        <div class="summary-bar" id="summaryBar"></div>

        <div class="card">
            <div class="toolbar">
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar participante...">
                <div class="view-toggle">
                    <button class="view-btn active" id="btnGrid" title="Cuadricula">
                        <i data-lucide="layout-grid" width="18" height="18"></i>
                    </button>
                    <button class="view-btn" id="btnList" title="Lista">
                        <i data-lucide="list" width="18" height="18"></i>
                    </button>
                </div>
            </div>

            <div id="participantsContainer"></div>
        </div>
    </div>

    <!-- Delete confirm modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <div class="modal-title">
                <i data-lucide="trash-2" width="20" height="20" style="color:var(--danger);margin-right:8px;vertical-align:middle;"></i>
                Eliminar mi registro
            </div>
            <p>Esto eliminara tu nombre de la lista para todos. No se puede deshacer.</p>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeDeleteModal()">
                    <i data-lucide="x" width="15" height="15"></i> Cancelar
                </button>
                <button class="btn btn-danger" onclick="confirmDelete()">
                    <i data-lucide="trash-2" width="15" height="15"></i> Eliminar
                </button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="firebase-config.js"></script>
    <script src="participantes.js"></script>
</body>
</html>
